name: Inspect isolated security reports
on:
  push:
    branches: [security/prepare-nvd-credential]
    paths: [.github/workflows/inspect-security-reports.yml]
  workflow_dispatch:
    inputs:
      run_id:
        description: Security Scan run ID in this repository
        required: true
        default: '40666627058'
        type: string
      dependency_run_id:
        description: Dependency scan run ID in this repository
        required: true
        default: '40673490915'
        type: string
permissions:
  actions: read
jobs:
  inspect:
    if: github.repository == 'm-idriss/3dime-api' && github.ref == 'refs/heads/security/prepare-nvd-credential'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect SARIF inventory without exposing messages or source snippets
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_RUN_ID: ${{ inputs.run_id || '40666627058' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SCAN_RUN_ID" =~ ^[1-9][0-9]{0,15}$ ]]
          gh api "repos/m-idriss/3dime-api/actions/runs/$SCAN_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/scan-artifacts.json"
          python3 - <<'PY'
          import json, os, re, subprocess, zipfile, io
          inventory = json.load(open(os.environ['RUNNER_TEMP'] + '/scan-artifacts.json'))
          matches = [a for a in inventory['artifacts'] if a['name'] == 'trivy-container-report' and not a['expired']]
          if len(matches) != 1:
              raise SystemExit('Expected exactly one available container report.')
          artifact_id = matches[0]['id']
          if not isinstance(artifact_id, int) or artifact_id <= 0 or matches[0]['size_in_bytes'] > 2_000_000:
              raise SystemExit('Invalid artifact metadata.')
          result = subprocess.run(['gh', 'api', f'repos/m-idriss/3dime-api/actions/artifacts/{artifact_id}/zip'], capture_output=True, timeout=45)
          if result.returncode or len(result.stdout) > 2_000_000:
              raise SystemExit('Artifact download unavailable or oversized; details suppressed.')
          with zipfile.ZipFile(io.BytesIO(result.stdout)) as archive:
              files = [f for f in archive.infolist() if f.filename.endswith('.sarif')]
              if len(files) != 1 or files[0].file_size > 5_000_000:
                  raise SystemExit('Invalid SARIF inventory.')
              report = json.loads(archive.read(files[0]))
          if report.get('version') != '2.1.0' or not isinstance(report.get('runs'), list):
              raise SystemExit('Invalid SARIF report.')
          results = [item for run in report['runs'] for item in run.get('results', [])]
          cves = sorted({item.get('ruleId', '') for item in results if re.fullmatch(r'CVE-[0-9]{4}-[0-9]{4,12}', item.get('ruleId', ''))})
          rules = {rule.get('id'): rule for run in report['runs'] for rule in run.get('tool', {}).get('driver', {}).get('rules', [])}
          findings = []
          for item in results:
              cve = item.get('ruleId', '')
              if not re.fullmatch(r'CVE-[0-9]{4}-[0-9]{4,12}', cve):
                  continue
              properties = rules.get(cve, {}).get('properties', {})
              score = properties.get('security-severity', '')
              score = score if re.fullmatch(r'(?:[0-9](?:\.[0-9])?|10(?:\.0)?)', str(score)) else 'unknown'
              text = item.get('message', {}).get('text', '')
              finding = {'cve': cve, 'cvss': score}
              for label, key in [('Package', 'package'), ('Installed Version', 'installed'), ('Fixed Version', 'fixed')]:
                  match = re.search(r'(?mi)^' + label + r':\s*([A-Za-z0-9@._/+, :~-]{1,180})$', text)
                  if match:
                      finding[key] = match.group(1).strip()
              findings.append(finding)
          summary = f'## Container SARIF inspection\n\nScan run: {os.environ["SCAN_RUN_ID"]}. Artifact: {artifact_id}.\n\nResult entries: {len(results)}. Unique CVE IDs: {len(cves)}.\n\n' + '\n'.join(json.dumps(f, sort_keys=True) for f in findings[:100]) + '\n\nOnly validated CVE identifiers, CVSS values and restricted package/version fields are printed. Successful scanning is not proof of zero findings. No raw messages, snippets or secret findings are printed.\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(summary)
          PY
  nvd-access:
    name: Verify NVD access without disclosing the credential
    if: github.event_name == 'workflow_dispatch' && github.repository == 'm-idriss/3dime-api' && github.ref == 'refs/heads/security/prepare-nvd-credential'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Make one bounded NVD access request
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import http.client, os, sys
          key = os.environ.get('NVD_API_KEY')
          if not key:
              raise SystemExit('NVD credential is unavailable; no request made.')
          connection = http.client.HTTPSConnection('services.nvd.nist.gov', timeout=20)
          try:
              connection.request('GET', '/rest/json/cves/2.0?resultsPerPage=1&startIndex=0', headers={'apiKey': key, 'User-Agent': 'Photocalia-Security-Qualification/1.0'})
              response = connection.getresponse()
              status = response.status
              print(f'NVD access request HTTP {status}. No response body or headers retained.')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write(f'## NVD access qualification\n\nOne request using the configured secret returned HTTP {status}. No credential, response body or headers were logged or stored. This does not qualify the full Maven analysis.\n')
              if status != 200:
                  sys.exit(1)
          except SystemExit:
              raise
          except Exception:
              raise SystemExit('NVD access request failed or timed out; diagnostic details suppressed.')
          finally:
              connection.close()
          PY
  nvd-feeds:
    name: Verify official NVD bulk-feed metadata
    if: github.repository == 'm-idriss/3dime-api' && github.ref == 'refs/heads/security/prepare-nvd-credential'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check official metadata without credentials
        shell: bash
        run: |
          python3 - <<'PYFEED'
          import datetime, http.client, re
          for year in ['modified', '2002', str(datetime.datetime.now(datetime.timezone.utc).year)]:
              connection = http.client.HTTPSConnection('nvd.nist.gov', timeout=20)
              try:
                  connection.request('GET', f'/feeds/json/cve/2.0/nvdcve-2.0-{year}.meta', headers={'User-Agent': 'Photocalia-Security-Qualification/1.0'})
                  response = connection.getresponse()
                  if response.status != 200:
                      raise SystemExit(f'Official feed metadata {year}: HTTP {response.status}.')
                  data = response.read(16385)
                  if len(data) > 16384:
                      raise SystemExit('Official feed metadata exceeds limit.')
                  properties = dict(line.split(':', 1) for line in data.decode('utf-8').splitlines() if ':' in line)
                  if not re.fullmatch('[0-9a-fA-F]{64}', properties.get('sha256', '').strip()):
                      raise SystemExit('Official feed digest metadata is unavailable.')
                  if not properties.get('lastModifiedDate'):
                      raise SystemExit('Official feed freshness metadata is unavailable.')
                  print(f'Official feed metadata {year}: HTTP 200; digest and freshness fields available. No credentials used.')
              finally:
                  connection.close()
          PYFEED
  dependency-report:
    name: Inspect completed dependency analysis without raw messages
    if: github.repository == 'm-idriss/3dime-api' && github.ref == 'refs/heads/security/prepare-nvd-credential'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    steps:
      - name: Read restricted dependency vulnerability inventory
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_SCAN_RUN_ID: ${{ inputs.dependency_run_id || '40673490915' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPENDENCY_SCAN_RUN_ID" =~ ^[1-9][0-9]{0,15}$ ]]
          gh api "repos/m-idriss/3dime-api/actions/runs/$DEPENDENCY_SCAN_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/dependency-artifacts.json"
          python3 - <<'PYREPORT'
          import io, json, os, re, subprocess, zipfile
          inventory = json.load(open(os.environ['RUNNER_TEMP'] + '/dependency-artifacts.json'))
          matches = [a for a in inventory['artifacts'] if a['name'] == 'dependency-check-report' and not a['expired']]
          if len(matches) != 1:
              raise SystemExit('Expected exactly one available dependency report.')
          artifact = matches[0]
          if not isinstance(artifact['id'], int) or artifact['id'] <= 0 or artifact['size_in_bytes'] > 5_000_000:
              raise SystemExit('Invalid artifact metadata.')
          downloaded = subprocess.run(['gh', 'api', f'repos/m-idriss/3dime-api/actions/artifacts/{artifact["id"]}/zip'], capture_output=True, timeout=45)
          if downloaded.returncode or len(downloaded.stdout) > 5_000_000:
              raise SystemExit('Dependency report download failed or exceeded limit; details suppressed.')
          with zipfile.ZipFile(io.BytesIO(downloaded.stdout)) as archive:
              files = [f for f in archive.infolist() if f.filename.endswith('dependency-check-report.json')]
              if len(files) != 1 or files[0].file_size > 10_000_000:
                  raise SystemExit('Invalid dependency JSON inventory.')
              report = json.loads(archive.read(files[0]))
          dependencies = report.get('dependencies')
          if not isinstance(dependencies, list):
              raise SystemExit('Dependency analysis report is incomplete.')
          findings = []
          for dependency in dependencies:
              filename = dependency.get('fileName', '')
              filename = filename if re.fullmatch(r'[A-Za-z0-9_.+-]{1,160}', filename) else 'not-disclosed'
              for vulnerability in dependency.get('vulnerabilities', []):
                  cve = vulnerability.get('name', '')
                  if not re.fullmatch(r'CVE-[0-9]{4}-[0-9]{4,12}', cve):
                      continue
                  scores = []
                  for field, key in [('cvssv4', 'baseScore'), ('cvssv3', 'baseScore'), ('cvssv2', 'score')]:
                      value = vulnerability.get(field, {}).get(key)
                      if isinstance(value, (int, float)) and not isinstance(value, bool) and 0 <= value <= 10:
                          scores.append(value)
                  findings.append({'cve': cve, 'file': filename, 'maximumReportedCvss': max(scores) if scores else None})
          critical = [f for f in findings if f['maximumReportedCvss'] is not None and f['maximumReportedCvss'] >= 9]
          critical.sort(key=lambda f: (-f['maximumReportedCvss'], f['cve'], f['file']))
          summary = f'## Completed OWASP dependency report\n\nScan run: {os.environ["DEPENDENCY_SCAN_RUN_ID"]}. Artifact: {artifact["id"]}. Dependencies: {len(dependencies)}. CVE instances: {len(findings)}. Unique CVE IDs: {len({f["cve"] for f in findings})}. Instances with a reported CVSS >= 9: {len(critical)}.\n\n' + '\n'.join(json.dumps(f, sort_keys=True) for f in critical[:50]) + '\n\nOnly validated identifiers, dependency filenames and numeric scores are printed. Findings need triage; no raw messages, paths, source snippets or secret data are shown.\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(summary)
          PYREPORT
