name: Verify production release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'm-idriss/3dime-api' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 23
    permissions:
      checks: read
    steps:
      - name: Wait for Cloud Build deployment of the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..40}; do
            result="$(gh api --hostname github.com \
              "repos/m-idriss/3dime-api/commits/$GITHUB_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "deploy-dime-api (image-to-ics)" and .app.slug == "google-cloud-build")] | sort_by(.started_at) | last | if . == null then "missing" elif .status != "completed" then "pending" else .conclusion end')"
            case "$result" in
              success) echo "Cloud Build deployment succeeded for the exact release commit."; exit 0 ;;
              missing|pending) sleep 30 ;;
              *) echo "Cloud Build deployment did not succeed; production verification blocked."; exit 1 ;;
            esac
          done
          echo "No successful exact-commit Cloud Build deployment within the bounded wait. Check the external trigger."
          exit 1

      - name: Verify public API health and frontend availability
        timeout-minutes: 2
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          for url, kind in [
              ("https://api.3dime.com/health", "api"),
              ("https://www.photocalia.com/", "frontend"),
          ]:
              request = urllib.request.Request(url, headers={"User-Agent": "Photocalia-release-verification/1"})
              with opener.open(request, timeout=15) as response:
                  data = response.read(1_048_577)
                  if response.status != 200 or len(data) > 1_048_576:
                      raise SystemExit("Release endpoint failed status or size validation")
              if kind == "api":
                  if json.loads(data).get("status") != "UP":
                      raise SystemExit("API health is not UP")
              elif b"<title>Photocalia" not in data:
                  raise SystemExit("Frontend identity validation failed")
              print(f"{kind}: public verification passed")
          PY

      - name: Record release verification
        run: |
          echo "Cloud Build exact-commit deployment and public API/frontend verification passed for $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
