name: Security Scan

on:
  push:
    branches: [main, release/backend-security-qualified, agents/cto-backend-platform-refresh]
    paths:
      - pom.xml
      - Dockerfile
      - src/**
      - scripts/verify-security-applicability.py
      - scripts/test_security_applicability.py
      - dependency-check-suppressions.xml
      - .github/workflows/security-scan.yml
  schedule:
    - cron: "24 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-scan:
    name: Maven dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NVD_DATA_DIR: /tmp/photocalia-nvd-database

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test applicability boundary and trace dependency origins
        run: |
          python3 -m unittest discover -s scripts -p 'test_security_applicability.py'
          mvn -B -ntp dependency:tree '-Dincludes=org.eclipse.jetty.npn:npn-api,io.vertx:*'

      - name: Require securely configured NVD credential
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$NVD_API_KEY" ]]; then
            echo "Configure the NVD_API_KEY repository Actions secret before dependency scanning."
            exit 1
          fi

      - name: Restore public vulnerability database only
        id: nvd-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.NVD_DATA_DIR }}
          key: nvd-public-db-13.0.0-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nvd-public-db-13.0.0-${{ runner.os }}-${{ runner.arch }}-

      - name: Bootstrap empty database from official annual feeds
        id: bootstrap
        if: steps.nvd-cache.outputs.cache-matched-key == ''
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$NVD_DATA_DIR"
          mvn -B -ntp org.owasp:dependency-check-maven:13.0.0:update-only \
            "-DdataDirectory=$NVD_DATA_DIR" \
            '-DnvdDatafeedUrl=https://nvd.nist.gov/feeds/json/cve/2.0/nvdcve-2.0-{0}.json.gz' \
            -DnvdValidForHours=0

      - name: Refresh restored database through the NVD API
        id: refresh
        if: steps.nvd-cache.outputs.cache-matched-key != ''
        timeout-minutes: 10
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B -ntp org.owasp:dependency-check-maven:13.0.0:update-only \
            "-DdataDirectory=$NVD_DATA_DIR" \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY -DnvdValidForHours=0

      - name: Require completed database update and record checkpoint
        env:
          RESTORED_CACHE_KEY: ${{ steps.nvd-cache.outputs.cache-matched-key }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$NVD_DATA_DIR/odc.mv.db"
          database_bytes="$(stat -c %s "$NVD_DATA_DIR/odc.mv.db")"
          (( database_bytes >= 10485760 && database_bytes <= 4294967296 ))
          mode=official-annual-feeds
          if [[ -n "$RESTORED_CACHE_KEY" ]]; then mode=incremental-api; fi
          echo "Database update completed: $mode; $database_bytes bytes. No secrets cached."
          echo "NVD update completed: $mode; database bytes: $database_bytes. Analysis uses this refreshed database." >> "$GITHUB_STEP_SUMMARY"

      - name: Save completed public database before analysis
        timeout-minutes: 5
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.NVD_DATA_DIR }}
          key: ${{ steps.nvd-cache.outputs.cache-primary-key }}

      - name: Run OWASP Dependency-Check with freshly updated database
        timeout-minutes: 10
        run: |
          mvn -B -ntp -Psecurity-scan verify -DskipTests \
            "-DdataDirectory=$NVD_DATA_DIR" -DautoUpdate=false

      - name: Upload dependency scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-check-report
          retention-days: 3
          path: target/dependency-check-report.*
          if-no-files-found: ignore

      - name: Upload dependency SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: target/dependency-check-report.sarif
        continue-on-error: true

  container-scan:
    name: Container image scan
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Build local image
        run: docker build --pull --tag 3dime-api:${{ github.sha }} .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 3dime-api:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload container SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: Upload container scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-container-report
          retention-days: 3
          path: trivy-results.sarif
          if-no-files-found: ignore
