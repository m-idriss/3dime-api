version: 2
updates:
  - package-ecosystem: "maven" # Maven package ecosystem
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Stripe majors change the pinned payment API; payment changes are excluded.
      - dependency-name: "com.stripe:stripe-java"
        update-types: ["version-update:semver-major"]
      # Firestore 3.38 calls newClientInterceptor, removed in instrumentation 2.26+.
      # Revisit with a coordinated Firestore/GAX migration and compatibility tests.
      - dependency-name: "io.opentelemetry.instrumentation:opentelemetry-grpc-1.6"
        versions: [">=2.26.0-alpha <3.0.0"]
